%YAML 1.1
---
agent:
  clarify_timeout: 600
  max_turns: 150
  reasoning_effort: max
approvals:
  cron_mode: deny
  deny:
    # Secrets & credentials
    - '*.ssh*'
    - '*.hermes/.env*'
    - '* .env'
    - '* .env *'
    - '*/.env'
    - '*/.env *'
    - '*.env.*'
    - '*.aws/credentials*'
    - '*.kube/config*'
    - '*.docker/config.json*'
    - '*sops/age*'
    - '*/var/lib/sops-nix/*'
    - '*/run/secrets*'
    # Privilege escalation
    - 'sudo'
    - 'sudo *'
    - '* sudo *'
    - '*&&sudo *'
    - '*|sudo *'
    - '*;sudo *'
    - 'doas'
    - 'doas *'
    - '* doas *'
    - 'pkexec'
    - 'pkexec *'
    - '* pkexec *'
    - 'su'
    - 'su -*'
    - 'su root*'
    - '* su -*'
    - '* su root*'
    # Destructive / remote-mutating git (soft/mixed git reset remains allowed)
    - 'git push'
    - 'git push *'
    - '* git push'
    - '* git push *'
    - '*git -C * push'
    - '*git -C * push *'
    - 'git reset*--hard*'
    - '* git reset*--hard*'
    - '*git -C * reset*--hard*'
    - 'git clean*'
    - '* git clean*'
    - '*git -C * clean*'
    # Catastrophic / NixOS active-config mutations (test & dry-run remain allowed)
    - 'rm -rf /'
    - '* rm -rf /'
    - '*rm -rf / *'
    - '*rm -rf /[*]*'
    - 'rm -fr /'
    - '* rm -fr /'
    - '*rm -fr / *'
    - '*rm -fr /[*]*'
    - '*rm -rf ~'
    - '*rm -rf ~/'
    - '*rm -rf ~ *'
    - '*rm -rf ~/[*]*'
    - '*rm -rf /home/finn'
    - '*rm -rf /home/finn/'
    - '*rm -rf /home/finn *'
    - '*rm -rf $HOME'
    - '*rm -rf $HOME/'
    - '*rm -rf $HOME *'
    - '*mkfs*'
    - '*dd *of=/dev/*'
    - '*nixos-rebuild*switch*'
    - '*nixos-rebuild*boot*'
    # Agent config self-modification (reads/diffs remain allowed)
    - '*hermes config set*'
    - '*>*hermes/config.yaml*'
    - '*sed*-i*hermes/config.yaml*'
    - '*tee*hermes/config.yaml*'
    - '*>*opencode.jsonc*'
    - '*sed*-i*opencode.jsonc*'
    - '*tee*opencode.jsonc*'
    - '*>*antigravity-cli/settings.json*'
    - '*sed*-i*antigravity-cli/settings.json*'
    - '*tee*antigravity-cli/settings.json*'
    - '*>*gemini/config/config.json*'
    - '*sed*-i*gemini/config/config.json*'
    - '*tee*gemini/config/config.json*'
  mode: off
  single_query_mode: deny
  unattended_mode: deny
auxiliary:
  approval:
    fallback_chain:
      - model: anthropic/claude-haiku-5.5
        provider: openrouter
    model: gwdg.deepseek-v4.1-flash-1017
    provider: upb
    timeout: 20
  background_review:
    model: gwdg.glm-5.3
    provider: upb
browser:
  cloud_provider: local
computer_use:
  backend: cua
delegation:
  max_concurrent_children: 8
  model: gwdg.deepseek-v4.1-flash-1017
  provider: upb
display:
  busy_input_mode: queue
  details_mode: expanded
  interface: tui
  platforms:
    cli:
      show_reasoning: true
  sections:
    activity: expanded
    subagents: expanded
    thinking: collapsed
    tools: expanded
  show_reasoning: false
  skin: default
  timestamps: true
  vim_mode: true
gateway:
  service_install_choice: decline
known_builtin_toolsets:
  cli:
    - browser
    - clarify
    - code_execution
    - computer_use
    - connections
    - context_engine
    - cronjob
    - delegation
    - discord
    - discord_admin
    - file
    - image_gen
    - kanban
    - memory
    - session_search
    - skills
    - stt
    - terminal
    - todo
    - tts
    - video
    - video_gen
    - vision
    - web
    - x_search
known_plugin_toolsets:
  cli:
    - a2a
memory:
  memory_char_limit: 3000
  nudge_interval: 25
model:
  api_mode: chat_completions
  base_url: https://ai-gateway.uni-paderborn.de/v1
  default: gwdg.deepseek-v4.1-flash-1017
  provider: upb
onboarding:
  seen:
    busy_input_prompt: true
    tool_progress_prompt: true
platform_toolsets:
  cli:
    - browser
    - clarify
    - code_execution
    - computer_use
    - connections
    - cronjob
    - delegation
    - file
    - image_gen
    - memory
    - session_search
    - skills
    - terminal
    - todo
    - tts
    - video
    - video_gen
    - vision
    - web
providers:
  upb:
    api_mode: chat_completions
    base_url: https://ai-gateway.uni-paderborn.de/v1
    default_model: gwdg.glm-5.3
    key_env: UPB_API_KEY
security:
  protected_instruction_files: true
  redact_secrets: true
skills:
  creation_nudge_interval: 25
  create_dir: ~/.hermes-brain/skills
terminal:
  cwd: /home/finn
telemetry:
  shared_metrics:
    enabled: false
    offer_version: 2
    send: false
video_gen:
  model: google/veo-3.1-lite
  provider: openrouter
_config_version: 54
